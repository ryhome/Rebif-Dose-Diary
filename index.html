<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotate</title>
<meta name="theme-color" content="#2F6F8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rotate">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6F8F7;--surface:#FFFFFF;--ink:#1F2A2E;--muted:#5E6E74;--line:#D8E0E2;
  --accent:#2F6F8F;--accent-ink:#FFFFFF;--ok:#3C8D5A;--wait:#C98A2B;--bad:#B5473C;
  --ok-bg:#E4F2E9;--wait-bg:#FBEFD9;--bad-bg:#F7E1DE;--accent-bg:#E1EDF3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121A1D;--surface:#1B262A;--ink:#E6EDEF;--muted:#9FB0B6;--line:#2E3C42;
    --accent:#6FB0CF;--accent-ink:#0F1A1F;--ok:#6CBF8A;--wait:#E0A94E;--bad:#E07A6E;
    --ok-bg:#1C3326;--wait-bg:#3A2D14;--bad-bg:#3C1F1B;--accent-bg:#1E3440;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A1D;--surface:#1B262A;--ink:#E6EDEF;--muted:#9FB0B6;--line:#2E3C42;
  --accent:#6FB0CF;--accent-ink:#0F1A1F;--ok:#6CBF8A;--wait:#E0A94E;--bad:#E07A6E;
  --ok-bg:#1C3326;--wait-bg:#3A2D14;--bad-bg:#3C1F1B;--accent-bg:#1E3440;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Thai","Noto Sans Thai","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
h1{font-size:1.5rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:16px 16px 92px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
header.top .sub{color:var(--muted);font-size:.9rem}
.view{display:none}.view.active{display:block}
.stack>*+*{margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel.tight{padding:12px 14px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:500;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.zone:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.field{display:block}
.field>span{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);
  border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:80px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:500}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.wait{background:var(--wait-bg);color:var(--wait)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:var(--accent-bg);color:var(--accent)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.hero .big{font-size:2rem;font-weight:600;line-height:1.1}
.hero .lead{color:var(--muted);margin-top:4px}
.notice{border-radius:12px;padding:12px 14px;font-size:.95rem}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.wait{background:var(--wait-bg);color:var(--wait)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
/* body map */
.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bodymap figure{margin:0;text-align:center}
.bodymap figcaption{font-size:.85rem;color:var(--muted);margin-top:4px}
.bodymap svg{width:100%;height:auto;max-height:52vh}
.silhouette{fill:var(--line);opacity:.75}
.mark{fill:var(--muted);stroke:var(--muted);opacity:.6}
.zone{cursor:pointer;stroke:var(--surface);stroke-width:1.5;fill-opacity:.88;transition:opacity .15s}
.zone.ok{fill:var(--ok)}.zone.wait{fill:var(--wait)}.zone.bad{fill:var(--bad)}
.zone.sel{stroke:var(--ink);stroke-width:3}
.zone:hover{opacity:.85}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.sitelist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.siteitem{border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;background:var(--surface);min-height:52px}
.siteitem.sel{border-color:var(--accent);background:var(--accent-bg)}
.siteitem .n{font-weight:500;display:block}
.siteitem .d{font-size:.8rem;color:var(--muted)}
/* log */
.week{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.week header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.entry{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .when{min-width:72px}
.entry .when b{display:block;font-weight:600}
.entry .when span{font-size:.85rem;color:var(--muted)}
.entry .body{flex:1}
.entry .actions{display:flex;flex-direction:column;gap:4px}
.entry .actions button{border:0;background:none;color:var(--muted);padding:4px;font-size:.85rem}
.entry .actions button:hover{color:var(--ink)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
/* doctor */
.symrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.symrow:last-child{border-bottom:0}
.symrow .opts{display:flex;gap:6px;flex-wrap:wrap}
.symrow .opts .chip{padding:5px 10px;min-height:32px;font-size:.85rem}
.symrow textarea{min-height:40px;margin-top:6px;display:none}
.symrow.on textarea{display:block}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:10}
nav.tabs a{flex:1;max-width:120px;text-decoration:none;color:var(--muted);font-size:.78rem;text-align:center;padding:6px 4px;border-radius:10px}
nav.tabs a svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--accent);font-weight:600}
/* modal */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.sheet .card{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.sevrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sevrow:last-child{border-bottom:0}
.sevrow .seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.sevrow .seg button{border:0;background:var(--surface);padding:6px 10px;min-width:40px;font-size:.85rem;color:var(--muted)}
.sevrow .seg button+button{border-left:1px solid var(--line)}
.sevrow .seg button.on{background:var(--accent);color:var(--accent-ink)}
.sevrow .seg button.on.s1{background:var(--ok)}.sevrow .seg button.on.s2{background:var(--wait)}.sevrow .seg button.on.s3{background:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.report{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.report h2{margin-top:18px;font-size:1.05rem;border-bottom:1px solid var(--line);padding-bottom:4px}
.report table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
.report th,.report td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.report .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.report .kpi{background:var(--bg);border-radius:10px;padding:10px}
.report .kpi b{display:block;font-size:1.3rem}
.report .kpi span{font-size:.8rem;color:var(--muted)}
.tablewrap{overflow-x:auto}
@media print{nav.tabs,header.top,.noprint{display:none!important}.app{padding:0;max-width:none}.report{border:0;padding:0}body{background:#fff;color:#000}:root{color-scheme:light}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><h1 id="pageTitle"></h1><p class="sub" id="pageSub"></p></div>
    <button class="btn" id="langBtn" style="min-height:36px;padding:6px 12px">EN</button>
  </header>

  <!-- TODAY -->
  <section class="view stack" id="view-today">
    <div class="hero">
      <p class="lead" data-t="nextLabel"></p>
      <p class="big" id="nextWhen">—</p>
      <p class="lead" id="nextDetail"></p>
    </div>
    <div id="gapNotice"></div>
    <div class="panel">
      <div class="row between"><h2 data-t="suggestTitle"></h2><span class="tag info" id="suggestTag"></span></div>
      <p class="muted small" data-t="suggestWhy"></p>
      <p id="suggestSite" style="font-size:1.2rem;font-weight:600;margin-top:8px">—</p>
      <button class="btn primary block" id="logNowBtn" style="margin-top:12px" data-t="logNow"></button>
    </div>
    <div class="panel tight">
      <div class="row between"><span data-t="adherence"></span><b id="adherence">—</b></div>
      <div class="row between" style="margin-top:6px"><span data-t="lastInj"></span><b id="lastInj">—</b></div>
      <div class="row between" style="margin-top:6px"><span data-t="reactions"></span><b id="reactCount">—</b></div>
    </div>
    <div class="row">
      <a class="btn grow" href="#report" data-t="viewReport"></a>
      <a class="btn grow" id="calBtnToday" target="_blank" rel="noopener" data-t="addCal"></a>
    </div>
    <div class="panel tight small muted" data-t="disclaimer"></div>
  </section>

  <!-- SITES -->
  <section class="view stack" id="view-sites">
    <div class="legend">
      <span><i style="background:var(--ok)"></i><span data-t="legendOk"></span></span>
      <span><i style="background:var(--wait)"></i><span data-t="legendWait"></span></span>
      <span><i style="background:var(--bad)"></i><span data-t="legendBad"></span></span>
    </div>
    <div class="panel">
      <div class="bodymap" id="bodymap"></div>
    </div>
    <div class="panel" id="siteDetail"></div>
    <div class="panel tight small muted" data-t="siteTips"></div>
  </section>

  <!-- LOG -->
  <section class="view stack" id="view-log">
    <button class="btn primary block" id="logAddBtn" data-t="addInj"></button>
    <div id="weeks"></div>
  </section>

  <!-- HEALTH: diary + doctor -->
  <section class="view stack" id="view-doctor">
    <div>
      <h2 data-t="diaryTitle"></h2>
      <p class="muted small" data-t="diaryIntro"></p>
    </div>
    <button class="btn primary block" id="diaryAddBtn" data-t="addDiary"></button>
    <div id="diaryList"></div>
    <div style="margin-top:24px">
      <h2 data-t="visitsTitle"></h2>
      <p class="muted small" data-t="doctorIntro"></p>
    </div>
    <button class="btn block" id="visitAddBtn" data-t="newVisit"></button>
    <div id="visits"></div>
  </section>

  <!-- REPORT -->
  <section class="view stack" id="view-report">
    <div class="row between noprint"><button class="btn" id="reportBack" data-t="back"></button>
      <div class="row"><button class="btn" id="csvBtn" data-t="csvBtn"></button><button class="btn primary" id="pdfBtn" data-t="pdfBtn"></button></div></div>
    <div id="reportBody" class="report"></div>
  </section>

  <!-- SETUP -->
  <section class="view stack" id="view-setup">
    <div class="panel stack">
      <h2 data-t="schedule"></h2>
      <label class="field"><span data-t="daysLabel"></span><div class="chips" id="dayChips"></div></label>
      <label class="field"><span data-t="timeLabel"></span><input type="time" id="setTime"></label>
      <label class="field"><span data-t="doseLabel"></span>
        <select id="setDose"><option value="8.8">8.8 mcg</option><option value="22">22 mcg</option><option value="44">44 mcg</option></select></label>
      <label class="field"><span data-t="deviceLabel"></span>
        <select id="setDevice"><option value="rebidose">Rebidose</option><option value="rebismart">RebiSmart</option><option value="syringe">Syringe / Rebiject</option></select></label>
      <label class="field"><span data-t="restLabel"></span>
        <select id="setRest"><option value="5">5</option><option value="7" selected>7</option><option value="10">10</option><option value="14">14</option></select></label>
      <label class="field"><span data-t="themeLabel"></span>
        <select id="setTheme"><option value="auto" data-t="themeAuto"></option><option value="light" data-t="themeLight"></option><option value="dark" data-t="themeDark"></option></select></label>
    </div>
    <div class="panel stack">
      <h2 data-t="remindTitle"></h2>
      <p class="muted small" data-t="remindNote"></p>
      <a class="btn primary block" id="calBtn" target="_blank" rel="noopener" data-t="addCal"></a>
    </div>
    <div class="panel stack">
      <h2 data-t="reportTitle"></h2>
      <p class="muted small" data-t="reportNote"></p>
      <a class="btn block" href="#report" data-t="viewReport"></a>
    </div>
    <div class="panel stack">
      <h2 data-t="dataTitle"></h2>
      <p class="muted small" data-t="dataNote"></p>
      <button class="btn block" id="exportBtn" data-t="exportBtn"></button>
      <textarea id="importBox" rows="3" data-ph="importPh"></textarea>
      <button class="btn block" id="importBtn" data-t="importBtn"></button>
      <button class="btn danger block" id="clearBtn" data-t="clearBtn"></button>
    </div>
    <div class="panel tight small muted" data-t="installNote"></div>
  </section>
</div>

<nav class="tabs" id="tabs">
  <a href="#today" data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-t="tabToday"></span></a>
  <a href="#sites" data-v="sites"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><path d="M8 10h8l-1 6h-6zM9 16l-1 6M15 16l1 6"/></svg><span data-t="tabSites"></span></a>
  <a href="#log" data-v="log"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span data-t="tabLog"></span></a>
  <a href="#doctor" data-v="doctor"><svg viewBox="0 0 24 24"><path d="M9 3v6a3 3 0 0 0 6 0V3M6 3h2M14 3h2M12 12v4a4 4 0 0 0 8 0v-1"/><circle cx="20" cy="13" r="2"/></svg><span data-t="tabHealth"></span></a>
  <a href="#setup" data-v="setup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span data-t="tabSetup"></span></a>
</nav>

<!-- Injection sheet -->
<div class="sheet" id="injSheet" role="dialog" aria-modal="true">
  <div class="card stack">
    <div class="row between"><h2 id="injSheetTitle"></h2><button class="btn" id="injCancel" style="min-height:36px" data-t="cancel"></button></div>
    <input type="hidden" id="injId">
    <div class="row">
      <label class="field grow"><span data-t="dateLabel"></span><input type="date" id="injDate"></label>
      <label class="field grow"><span data-t="timeLabel"></span><input type="time" id="injTime"></label>
    </div>
    <div class="field"><span data-t="siteLabel"></span><div class="sitelist" id="injSites"></div></div>
    <div class="field"><span data-t="reactionLabel"></span>
      <div class="chips"><button class="chip" id="reactNo" data-t="no"></button><button class="chip" id="reactYes" data-t="yes"></button></div>
    </div>
    <label class="field" id="reactDescWrap" style="display:none"><span data-t="reactionDesc"></span><textarea id="injReact" rows="2"></textarea></label>
    <label class="field"><span data-t="noteLabel"></span><textarea id="injNote" rows="2" data-ph="notePh"></textarea></label>
    <button class="btn primary block" id="injSave" data-t="save"></button>
  </div>
</div>

<!-- Visit sheet -->
<div class="sheet" id="visitSheet" role="dialog" aria-modal="true">
  <div class="card stack">
    <div class="row between"><h2 data-t="visitTitle"></h2><button class="btn" id="visitCancel" style="min-height:36px" data-t="cancel"></button></div>
    <input type="hidden" id="visitId">
    <label class="field"><span data-t="visitDate"></span><input type="date" id="visitDate"></label>
    <div class="field"><span data-t="symptoms"></span><div id="symList"></div></div>
    <label class="field"><span data-t="top3"></span><textarea id="visitTop3" rows="3"></textarea></label>
    <label class="field"><span data-t="questions"></span><textarea id="visitQ" rows="3"></textarea></label>
    <button class="btn primary block" id="visitSave" data-t="save"></button>
  </div>
</div>

<!-- Diary sheet -->
<div class="sheet" id="diarySheet" role="dialog" aria-modal="true">
  <div class="card stack">
    <div class="row between"><h2 id="diarySheetTitle"></h2><button class="btn" id="diaryCancel" style="min-height:36px" data-t="cancel"></button></div>
    <input type="hidden" id="diaryId">
    <label class="field"><span data-t="dateLabel"></span><input type="date" id="diaryDate"></label>
    <div id="diarySyms"></div>
    <label class="field"><span data-t="diaryNote"></span><textarea id="diaryNote" rows="2"></textarea></label>
    <button class="btn primary block" id="diarySave" data-t="save"></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- i18n ---------- */
const T = {
th:{
  appTitle:"บันทึกการฉีดยา", appSub:"ฉีดสัปดาห์ละ 3 ครั้ง ห่างกันอย่างน้อย 48 ชม.",
  tabToday:"วันนี้", tabSites:"ตำแหน่ง", tabLog:"ประวัติ", tabDoctor:"พบแพทย์", tabSetup:"ตั้งค่า",
  nextLabel:"เข็มต่อไป", suggestTitle:"ตำแหน่งที่แนะนำ", suggestWhy:"เลือกจุดที่พักมานานที่สุดและพ้นระยะพักแล้ว",
  logNow:"บันทึกการฉีด", adherence:"ฉีดครบ 4 สัปดาห์ล่าสุด", lastInj:"ฉีดครั้งล่าสุด", reactions:"ปฏิกิริยาที่จุดฉีด (30 วัน)",
  disclaimer:"แอปนี้ช่วยจดบันทึกเท่านั้น ไม่ใช่คำแนะนำทางการแพทย์ ถ้าจุดฉีดบวม เจ็บมาก หรือดูติดเชื้อ ให้ติดต่อแพทย์ทันที",

const SITE_IDS = ["abdUL","abdUR","abdLL","abdLR","thighLF","thighLO","thighRF","thighRO","armL","armR","gluteL","gluteR"];

/* ---------- state ---------- */
const KEY = "injection-tracker-v1";
let S = { lang:"th", days:[1,3,5], time:"20:00", dose:"44", device:"rebidose", rest:7, theme:"auto", injections:[], visits:[], diary:[] };
function load(){ try{ const raw = localStorage.getItem(KEY); if(raw){ const o = JSON.parse(raw); S = Object.assign(S, o); } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const t = k => (T[S.lang][k] ?? T.en[k] ?? k);
const fmt = (s,o) => s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2,"0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nowIso = () => isoDate(new Date());
const toDate = (dateStr,timeStr="00:00") => new Date(`${dateStr}T${timeStr}:00`);
const daysBetween = (a,b) => Math.floor((b-a)/86400000);
function weekStart(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function fmtDate(dateStr){ const d=toDate(dateStr); return `${t("dow")[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`; }
function fmtDateLong(dateStr){ const d=toDate(dateStr); return d.toLocaleDateString(S.lang==="th"?"th-TH":"en-GB",{day:"numeric",month:"short",year:"numeric"}); }

/* ---------- derived ---------- */
function sortedInj(){ return [...S.injections].sort((a,b)=> toDate(b.date,b.time)-toDate(a.date,a.time)); }
function siteInfo(id){
  const list = sortedInj().filter(i=>i.site===id);
  const last = list[0];
  const now = new Date();
  const lastReact = list.find(i=>i.reaction);
  const dLast = last ? daysBetween(toDate(last.date,last.time), now) : null;
  const dReact = lastReact ? daysBetween(toDate(lastReact.date,lastReact.time), now) : null;
  let status = "ok";
  if (dReact !== null && dReact < 14) status = "bad";
  else if (dLast !== null && dLast < S.rest) status = "wait";
  return { last, dLast, dReact, status, count:list.length };
}
function suggestSite(){
  const infos = SITE_IDS.map(id=>({id,...siteInfo(id)}));
  const ready = infos.filter(i=>i.status==="ok");
  const pool = ready.length ? ready : infos.filter(i=>i.status!=="bad");
  pool.sort((a,b)=> (a.dLast===null?1e9:a.dLast) < (b.dLast===null?1e9:b.dLast) ? 1 : -1);
  return { site: pool[0] ? pool[0].id : null, allResting: ready.length===0 };
}
function nextDue(){
  if(!S.days.length) return null;
  const now = new Date();
  const [hh,mm] = S.time.split(":").map(Number);
  for(let add=0; add<8; add++){
    const d = new Date(now); d.setDate(d.getDate()+add); d.setHours(hh,mm,0,0);
    if(!S.days.includes(d.getDay())) continue;
    const already = S.injections.some(i=>i.date===isoDate(d));
    if(already) continue;
    return { d, add };
  }
  return null;
}
function adherence(){
  const now = new Date(); const start = weekStart(now); start.setDate(start.getDate()-21);
  const done = S.injections.filter(i=> toDate(i.date) >= start && toDate(i.date) <= now).length;
  // expected = scheduled days from start up to today
  let exp=0; for(let d=new Date(start); d<=now; d.setDate(d.getDate()+1)) if(S.days.includes(d.getDay())) exp++;
  return {done, exp};
}

/* ---------- rendering ---------- */
function applyText(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(el=> el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-ph]").forEach(el=> el.placeholder = t(el.dataset.ph));
  document.getElementById("langBtn").textContent = S.lang==="th" ? "EN" : "ไทย";
}
function applyTheme(){
  if(S.theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
}
function renderToday(){
  const nd = nextDue();
  const el = document.getElementById("nextWhen"), det = document.getElementById("nextDetail");
  if(!nd){ el.textContent="—"; det.textContent=""; }
  else{
    const label = nd.add===0 ? t("today") : nd.add===1 ? t("tomorrow") : t("dowLong")[nd.d.getDay()];
    el.textContent = `${label} ${t("at")} ${S.time}`;
    const past = nd.add===0 && nd.d < new Date();
    det.textContent = `${t("dowLong")[nd.d.getDay()]} ${nd.d.getDate()}/${nd.d.getMonth()+1}` + (past ? ` · ${t("overdue")}` : "");
  }
  const last = sortedInj()[0];
  const gap = document.getElementById("gapNotice");
  if(last){
    const h = Math.floor((new Date()-toDate(last.date,last.time))/3600000);
    gap.innerHTML = `<div class="notice ${h<48?"wait":"ok"}">${fmt(t(h<48?"gapWarn":"gapOk"),{h})}</div>`;
    document.getElementById("lastInj").textContent = `${fmtDate(last.date)} ${last.time} · ${t("sites")[last.site]}`;
  } else { gap.innerHTML=""; document.getElementById("lastInj").textContent="—"; }
  const sg = suggestSite();
  document.getElementById("suggestSite").textContent = sg.site ? t("sites")[sg.site] : "—";
  document.getElementById("suggestTag").textContent = sg.allResting ? t("legendWait") : t("legendOk");
  document.getElementById("suggestTag").className = "tag " + (sg.allResting?"wait":"ok");
  document.querySelector("#view-today .panel .muted").textContent = sg.allResting ? t("noSuggest") : t("suggestWhy");
  const a = adherence();
  document.getElementById("adherence").textContent = a.exp ? `${Math.min(a.done,a.exp)} ${t("of")} ${a.exp} (${Math.round(Math.min(100,a.done/a.exp*100))}%)` : "—";
  const cut = new Date(); cut.setDate(cut.getDate()-30);
  document.getElementById("reactCount").textContent = S.injections.filter(i=>i.reaction && toDate(i.date)>=cut).length;
}

  const diary = [...S.diary].filter(d=>toDate(d.date)>=start).sort((a,b)=>a.date.localeCompare(b.date));
  let exp=0; for(let d=new Date(start); d<=now; d.setDate(d.getDate()+1)) if(S.days.includes(d.getDay())) exp++;

  return {start, now, inj, diary, exp, siteCount, symCount};
}

function csvText(){

  [...S.diary].sort((a,b)=>a.date.localeCompare(b.date)).forEach(d=>{

document.getElementById("diaryCancel").onclick = ()=> document.getElementById("diarySheet").classList.remove("open");
document.getElementById("diarySave").onclick = ()=>{
  const id = document.getElementById("diaryId").value;
  const date = document.getElementById("diaryDate").value||nowIso();
  const rec = { id:id||uid(), date, items:diaryItems, note: document.getElementById("diaryNote").value.trim() };
  S.diary = S.diary.filter(d=> d.id!==rec.id && !(d.date===date && !id));
  S.diary.push(rec);
  save(); document.getElementById("diarySheet").classList.remove("open"); renderDiary(); toast(t("saved"));
};
function delDiary(id){ if(!confirm(t("confirmDel"))) return; S.diary = S.diary.filter(d=>d.id!==id); save(); renderDiary(); toast(t("deleted")); }
document.getElementById("diaryAddBtn").onclick = ()=>openDiary(null);

/* ---------- setup handlers ---------- */
document.getElementById("setTime").onchange = e=>{ S.time=e.target.value||"20:00"; save(); renderToday(); };
document.getElementById("setDose").onchange = e=>{ S.dose=e.target.value; save(); };
document.getElementById("setDevice").onchange = e=>{ S.device=e.target.value; save(); };
document.getElementById("setRest").onchange = e=>{ S.rest=+e.target.value; save(); renderAll(); };
document.getElementById("setTheme").onchange = e=>{ S.theme=e.target.value; save(); applyTheme(); };
document.getElementById("langBtn").onclick = ()=>{ S.lang = S.lang==="th"?"en":"th"; save(); renderAll(); setTitle(); };
document.getElementById("exportBtn").onclick = async ()=>{
  const txt = JSON.stringify(S);
  try{ await navigator.clipboard.writeText(txt); toast(t("copied")); }
  catch(e){ document.getElementById("importBox").value = txt; document.getElementById("importBox").select(); }
};
document.getElementById("importBtn").onclick = ()=>{
  try{ const o = JSON.parse(document.getElementById("importBox").value); if(!Array.isArray(o.injections)) throw 0;
    S = Object.assign(S,o); S.diary=S.diary||[]; save(); renderAll(); applyTheme(); toast(t("imported")); document.getElementById("importBox").value=""; }
  catch(e){ toast(t("importFail")); }
};
document.getElementById("clearBtn").onclick = ()=>{ if(!confirm(t("confirmClear"))) return; try{ localStorage.removeItem(KEY);}catch(e){} location.reload(); };

/* ---------- routing ---------- */
const VIEWS = ["today","sites","log","doctor","setup","report"];
function route(){
  let v = location.hash.replace("#","");
  if(!VIEWS.includes(v)) v = "today";
  VIEWS.forEach(x=> document.getElementById("view-"+x).classList.toggle("active", x===v));
  document.querySelectorAll("#tabs a").forEach(a=> a.classList.toggle("on", a.dataset.v===v));
  setTitle(v);
  if(v==="report") renderReport();
  window.scrollTo(0,0);
}
function setTitle(v){ v = v || (location.hash.replace("#","")||"today"); if(!VIEWS.includes(v)) v="today";
  document.getElementById("pageTitle").textContent = v==="today" ? t("appTitle") : v==="report" ? t("reportTitle") : v==="doctor" ? t("tabHealth") : t("tab"+v[0].toUpperCase()+v.slice(1));
  document.getElementById("pageSub").textContent = v==="today" ? t("appSub") : ""; }
window.addEventListener("hashchange", route);

/* ---------- misc ---------- */
let toastT; function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1800); }
document.querySelectorAll(".sheet").forEach(s=> s.addEventListener("click", e=>{ if(e.target===s) s.classList.remove("open"); }));

load(); applyTheme(); renderAll(); route();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
